name: ci

"on":
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: PYTHON=python make security-check

  python-readiness:
    name: Python readiness
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: PIP_CONSTRAINT=requirements.lock python -m pip install -e '.[dev]'
      - run: PYTHON=python make quality-check
      - run: PYTHON=python make readiness-check

  postgres-contract:
    name: PostgreSQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: PIP_CONSTRAINT=requirements.lock python -m pip install -e '.[dev]'
      - run: PYTHON=python make postgres-contract-check
      - run: python -m src.warehouse.model_approval_contract_check
      - run: >-
          python -m src.warehouse.postgres_consistency
          --check sql/model_approval_consistency_checks.sql
      - run: python -m src.warehouse.operational_service_level_contract_check
      - run: >-
          python -m src.orchestration.plan_portfolio_risk_notification_retries
          --planned-at 2026-12-31T23:59:59Z
          --policy-id us-tech-standard
          --portfolio-id us-tech-equal
          --summary-json .demo/notification-retry-plan-contract.json
      - run: >-
          python -m src.warehouse.postgres_consistency
          --check sql/operational_service_levels_consistency_checks.sql
      - if: failure()
        run: docker compose logs --no-color postgres
      - if: always()
        run: docker compose down -v --remove-orphans

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - run: make infrastructure-check
